name: Week 11 Check
on:
  push:
    paths:
      - 'labs/week-11/**'
      - '.github/workflows/week11-check.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/week-11/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install && npm run build
      - run: npm run check
